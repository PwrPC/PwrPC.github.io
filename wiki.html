<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikipedia al azar</title>
<style>
  :root{
    --wiki-blue:#0645ad;
    --wiki-blue-hover:#0b0080;
    --wiki-page-bg:#eaecf0;
    --wiki-card-bg:#ffffff;
    --wiki-border:#a2a9b1;
    --wiki-thumb-bg:#f8f9fa;
    --wiki-text:#202122;
    --wiki-text-muted:#54595d;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--wiki-page-bg);
    font-family:sans-serif, Arial, Helvetica, "Liberation Sans";
    color:var(--wiki-text);
    min-height:100vh;
  }

  .topbar{
    padding:16px 20px;
  }
  .home-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
    color:var(--wiki-blue);
    font-size:14px;
    border:1px solid var(--wiki-border);
    background:var(--wiki-card-bg);
    padding:7px 14px;
    border-radius:2px;
  }
  .home-btn:hover{ background:#f8f9fa; text-decoration:underline; }

  main{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 20px 60px;
  }

  .page-title{
    font-family:"Linux Libertine","Georgia",serif;
    font-size:26px;
    font-weight:400;
    border-bottom:1px solid var(--wiki-border);
    padding-bottom:10px;
    margin:6px 0 28px 0;
    width:min(90vw, 700px);
    text-align:center;
  }

  /* ---------- the wikipedia-style thumbnail card ---------- */
  .thumb{
    width:min(90vw, 700px);
    min-width:50vw;
    background:var(--wiki-card-bg);
    border:1px solid var(--wiki-border);
    padding:3px;
  }
  .thumb-image-wrap{
    background:var(--wiki-thumb-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:200px;
    overflow:hidden;
  }
  .thumb-image-wrap img{
    max-width:100%;
    max-height:420px;
    display:block;
  }
  .thumbcaption{
    padding:9px 9px 8px 9px;
    font-size:13.5px;
    line-height:1.5;
    text-align:left;
  }
  .magnify{
    float:right;
    margin-left:8px;
    width:16px; height:16px;
    color:var(--wiki-text-muted);
    font-size:14px;
    line-height:1;
  }
  .thumbcaption a{ color:var(--wiki-blue); text-decoration:none; }
  .thumbcaption a:hover{ text-decoration:underline; }
  .thumbcaption .title-line{
    font-weight:700;
    display:block;
    margin-bottom:4px;
  }

  .thumb.loading .thumb-image-wrap{
    color:var(--wiki-text-muted);
    font-size:13px;
  }

  /* ---------- action buttons ---------- */
  .actions{
    width:min(90vw, 700px);
    min-width:50vw;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:18px;
  }
  .actions button, .actions a{
    font-family:inherit;
    font-size:14px;
    padding:10px 16px;
    border-radius:2px;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
  }
  #randomBtn{
    background:var(--wiki-blue);
    border:1px solid var(--wiki-blue);
    color:#ffffff;
  }
  #randomBtn:hover{ background:var(--wiki-blue-hover); border-color:var(--wiki-blue-hover); }
  #randomBtn:disabled{ opacity:0.6; cursor:default; }

  #sourceBtn{
    background:var(--wiki-card-bg);
    border:1px solid var(--wiki-border);
    color:var(--wiki-blue);
  }
  #sourceBtn:hover{ background:#f8f9fa; text-decoration:underline; }
  #sourceBtn[aria-disabled="true"]{
    color:var(--wiki-text-muted);
    pointer-events:none;
    opacity:0.6;
  }

  footer{
    margin-top:34px;
    font-size:11.5px;
    color:var(--wiki-text-muted);
    text-align:center;
  }
  footer a{ color:var(--wiki-blue); }
</style>
</head>
<body>

<div class="topbar">
  <a href="https://www.heichi.org" class="home-btn">← Volver a inicio</a>
</div>

<main>
  <h1 class="page-title">Wikipedia al azar</h1>

  <div class="thumb loading" id="thumbCard">
    <div class="thumb-image-wrap" id="imageWrap">
      <span>Cargando…</span>
    </div>
    <div class="thumbcaption" id="captionBox">
      Buscando un artículo con imagen…
    </div>
  </div>

  <div class="actions">
    <button id="randomBtn">Otro al azar</button>
    <a id="sourceBtn" href="#" target="_blank" rel="noopener" aria-disabled="true">Ver fuente en Wikipedia →</a>
  </div>

  <footer>
    Contenido obtenido en vivo desde la API pública de <a href="https://es.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a>,
    bajo licencia CC BY-SA. Los créditos completos están en la página fuente de cada artículo.
  </footer>
</main>

<script>
(function(){
  const WIKI_LANG = 'es';
  const API = `https://${WIKI_LANG}.wikipedia.org/api/rest_v1/page/random/summary`;
  const MAX_ATTEMPTS = 8;
  const MAX_CAPTION_LEN = 220;

  const thumbCard = document.getElementById('thumbCard');
  const imageWrap = document.getElementById('imageWrap');
  const captionBox = document.getElementById('captionBox');
  const randomBtn = document.getElementById('randomBtn');
  const sourceBtn = document.getElementById('sourceBtn');

  function truncate(text, max){
    if(!text) return '';
    if(text.length <= max) return text;
    const cut = text.slice(0, max);
    return cut.slice(0, cut.lastIndexOf(' ')) + '…';
  }

  async function fetchRandomWithImage(){
    for(let i=0; i<MAX_ATTEMPTS; i++){
      try{
        const res = await fetch(API, { headers: { 'Accept':'application/json' } });
        if(!res.ok) continue;
        const data = await res.json();
        const img = data.originalimage || data.thumbnail;
        if(img && img.source && data.extract){
          return {
            title: data.title,
            extract: data.extract,
            imageSrc: img.source,
            pageUrl: (data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page) || null
          };
        }
      }catch(e){ /* try again */ }
    }
    return null;
  }

  async function loadRandom(){
    randomBtn.disabled = true;
    thumbCard.classList.add('loading');
    imageWrap.innerHTML = '<span>Cargando…</span>';
    captionBox.innerHTML = 'Buscando un artículo con imagen…';
    sourceBtn.setAttribute('aria-disabled', 'true');
    sourceBtn.href = '#';

    const result = await fetchRandomWithImage();

    if(!result){
      imageWrap.innerHTML = '<span>No se encontró una imagen. Intenta de nuevo.</span>';
      captionBox.textContent = '';
      randomBtn.disabled = false;
      return;
    }

    thumbCard.classList.remove('loading');
    imageWrap.innerHTML = '';
    const imgEl = document.createElement('img');
    imgEl.src = result.imageSrc;
    imgEl.alt = result.title;
    imageWrap.appendChild(imgEl);

    captionBox.innerHTML =
      '<span class="magnify">⤢</span>' +
      '<span class="title-line">' + result.title + '</span>' +
      truncate(result.extract, MAX_CAPTION_LEN);

    if(result.pageUrl){
      sourceBtn.href = result.pageUrl;
      sourceBtn.removeAttribute('aria-disabled');
    }

    randomBtn.disabled = false;
  }

  randomBtn.addEventListener('click', loadRandom);
  loadRandom();
})();
</script>
</body>
</html>
